<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1023">
  <title>El Oráculo Creativo · 2027</title>
  <meta name="description" content="Saca tu carta y descubre lo que 2027 tiene preparado para ti.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!--
    Sprite SVG: el dibujo del dorso se genera en JS (js/oracle.js → buildBackArt)
    y se reutiliza en todas las cartas del mazo con <use href="#back-art">.
  -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="back-art" viewBox="0 0 200 324"></symbol>
  </svg>

  <main class="oracle" id="oracle">

    <header class="oracle__header">
      <p class="brand"><img src="assets/logo-nextmedia.png" alt="next'media" width="720" height="117"></p>
      <h1 class="oracle__title" id="pageTitle">El Oráculo <em>Creativo</em></h1>
    </header>

    <!-- Destellos y aura: se colocan (vía JS) detrás de la posición final de la carta -->
    <div class="fx" id="fx" aria-hidden="true">
      <span class="fx__aura"></span>
    </div>

    <!-- ===================== EL MAZO ===================== -->
    <div class="deck" id="deck" role="button" tabindex="0"
         aria-label="Mazo de cartas. Toca o desliza hacia arriba para sacar tu carta del 2027">

      <span class="deck__ao" aria-hidden="true"></span>
      <span class="deck__reflection" aria-hidden="true"></span>

      <!-- Cartas estáticas del mazo (volumen). --i = profundidad -->
      <span class="deck__stack" aria-hidden="true">
        <span class="deck__card" style="--i:4"><svg><use href="#back-art"/></svg></span>
        <span class="deck__card" style="--i:3"><svg><use href="#back-art"/></svg></span>
        <span class="deck__card" style="--i:2"><svg><use href="#back-art"/></svg></span>
        <span class="deck__card" style="--i:1"><svg><use href="#back-art"/></svg></span>
        <span class="deck__card" style="--i:0"><svg><use href="#back-art"/></svg></span>
      </span>
      <span class="deck__shade" aria-hidden="true"></span>

      <!-- Carta que se roba:
           .card (lift) > .card__tilt (vanilla-tilt, ratón) > .card__float (reposo / giroscopio / dedo) > .card__inner (flip) -->
      <div class="card" id="card">
        <div class="card__tilt" id="cardTilt">
         <div class="card__float" id="cardFloat">
          <div class="card__inner" id="cardInner">

            <div class="card__face card__back" aria-hidden="true">
              <svg><use href="#back-art"/></svg>
            </div>

            <article class="card__face card__front" aria-labelledby="cardTitle">
              <p class="card__numeral" id="cardNumeral"></p>
              <figure class="card__art">
                <img id="cardImage" src="" alt="" width="200" height="250" decoding="async">
              </figure>
              <h2 class="card__title" id="cardTitle"></h2>
              <span class="card__glitter" aria-hidden="true"></span>
              <span class="card__shine" aria-hidden="true"></span>
            </article>

          </div>
         </div>
        </div>
      </div>
    </div>

    <p class="hint" id="hint" aria-hidden="true">
      <svg class="hint__chevron" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      <span id="hintText">Toca para sacar tu carta del 2027</span>
    </p>

    <!-- ===================== REVELACIÓN ===================== -->
    <section class="reading" id="reading" aria-live="polite">
      <p class="reading__kicker" id="readingKicker"></p>
      <p class="reading__text" id="readingText"></p>
    </section>

    <footer class="oracle__footer">
      <button class="retry" id="retry" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        <span id="retryLabel">Volver a probar suerte</span>
      </button>
    </footer>

  </main>

  <!-- ===================== SELECTOR DE IDIOMA (fijo arriba a la derecha) =====================
       Los textos de cada idioma están en js/oracle.js → TEXTS -->
  <div class="lang" id="lang" role="group" aria-label="Idioma" data-active="es">
    <span class="lang__thumb" aria-hidden="true"></span>
    <button class="lang__opt" type="button" data-lang="es" aria-pressed="true">ES</button>
    <button class="lang__opt" type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>

  <!-- ===================== POPUP DE BIENVENIDA =====================
       Se activa/desactiva en js/oracle.js → CONFIG.showWelcome (true / false) -->
  <div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" aria-describedby="welcomeText" hidden>
    <div class="welcome__panel">
      <span class="welcome__card" aria-hidden="true"><svg><use href="#back-art"/></svg></span>
      <h2 class="welcome__title" id="welcomeTitle">Bienvenido al <em>Oráculo Creativo</em></h2>
      <p class="welcome__text" id="welcomeText">Las cartas del tarot te dirán qué nos depara el futuro.</p>
      <button class="retry welcome__cta" id="welcomeCta" type="button">
        <span id="welcomeCtaLabel">Probar mi suerte</span>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js" defer></script>
  <script src="js/oracle.js" defer></script>
</body>
</html>
